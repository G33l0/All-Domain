[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-atlas"
version = "3.0.0"
description = "Asynchronous domain discovery, technology fingerprinting and inventory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "IamG2ont" }]
keywords = ["osint", "recon", "domains", "certificate-transparency", "fingerprinting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.19",
    "idna>=3.4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
tor = ["aiohttp-socks>=0.8"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "PySide6>=6.5"]
build = ["pyinstaller>=6.0"]

[project.scripts]
domain-atlas = "domainatlas.cli:main"

# gui-scripts produces a launcher with no console window on Windows.
[project.gui-scripts]
domain-atlas-gui = "domainatlas.cli:main"

[project.urls]
Homepage = "https://github.com/G33l0/All-Domain"

[tool.setuptools]
packages = ["domainatlas", "domainatlas.qtui"]
py-modules = ["domain_atlas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
